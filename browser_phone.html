<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Receptionist — Test Call</title>
  <script src="/static/twilio.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .phone {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      width: 320px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h2 { color: #1a1a2e; font-size: 18px; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 32px; }
    .status {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #555;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status.ready    { background: #e8f5e9; color: #2e7d32; }
    .status.calling  { background: #fff3e0; color: #e65100; }
    .status.error    { background: #fce4ec; color: #c62828; }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    .btn-call   { background: #22c55e; color: white; }
    .btn-call:hover:not(:disabled)   { background: #16a34a; transform: translateY(-1px); }
    .btn-hangup { background: #ef4444; color: white; }
    .btn-hangup:hover:not(:disabled) { background: #dc2626; transform: translateY(-1px); }
    .number { color: #11418A; font-weight: 700; font-size: 20px; margin-bottom: 24px; letter-spacing: 1px; }
    .log {
      background: #f8f9fa; border-radius: 12px; padding: 12px;
      margin-top: 20px; max-height: 150px; overflow-y: auto;
      text-align: left; font-size: 11px; color: #666;
    }
    .log-entry { padding: 3px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
<div class="phone">
  <div class="logo">🦷</div>
  <h2>Tanuj Dental Clinic</h2>
  <p class="subtitle">AI Receptionist — Browser Test</p>
  <div class="number">+1 239 423 8893</div>
  <div class="status" id="status">Initialising...</div>
  <button class="btn btn-call"   id="btnCall"   disabled onclick="makeCall()">📞 Call Now</button>
  <button class="btn btn-hangup" id="btnHangup" disabled onclick="hangUp()">🔴 Hang Up</button>
  <div class="log" id="log"></div>
</div>

<script>
  let device, call;

  function log(msg) {
    const el = document.getElementById('log');
    const e  = document.createElement('div');
    e.className = 'log-entry';
    e.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
    el.prepend(e);
  }

  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (cls || '');
  }

  async function init() {
    try {
      setStatus('Getting token...');
      const res  = await fetch('http://localhost:5001/token');
      const data = await res.json();
      log('Token received');

      device = new Twilio.Device(data.token, {
        codecPreferences: ['opus', 'pcmu'],
        logLevel: 1
      });

      device.on('registered', () => {
        setStatus('Ready to call ✅', 'ready');
        document.getElementById('btnCall').disabled = false;
        log('Device registered');
      });

      device.on('error', (err) => {
        setStatus('Error: ' + err.message, 'error');
        log('Error: ' + err.message);
        document.getElementById('btnCall').disabled = false;
        document.getElementById('btnHangup').disabled = true;
      });

      device.register();

    } catch (e) {
      setStatus('Cannot connect. Is server running?', 'error');
      log('Init error: ' + e.message);
    }
  }

  async function makeCall() {
    if (!device) return;
    try {
      setStatus('Calling...', 'calling');
      document.getElementById('btnCall').disabled = true;
      document.getElementById('btnHangup').disabled = false;
      log('Dialling +12394238893...');

      call = await device.connect({ params: { To: '+12394238893' } });

      call.on('accept',     ()  => { setStatus('Connected — speak now 🎙️', 'calling'); log('Call accepted'); });
      call.on('disconnect', ()  => {
        setStatus('Call ended', 'ready');
        document.getElementById('btnCall').disabled = false;
        document.getElementById('btnHangup').disabled = true;
        log('Call disconnected');
      });
      call.on('error',      (e) => { log('Call error: ' + e.message); });

    } catch (e) {
      setStatus('Call failed: ' + e.message, 'error');
      log('Call error: ' + e.message);
      document.getElementById('btnCall').disabled = false;
      document.getElementById('btnHangup').disabled = true;
    }
  }

  function hangUp() {
    if (call) call.disconnect();
    else if (device) device.disconnectAll();
  }

  init();
</script>
</body>
</html>
