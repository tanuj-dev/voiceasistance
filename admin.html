<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — AI Receptionist</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue:  #11418A;
      --blue2: #1a56b0;
      --green: #22c55e;
      --red:   #ef4444;
      --bg:    #f1f5f9;
      --card:  #ffffff;
      --text:  #1e293b;
      --muted: #64748b;
      --border:#e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px; min-height: 100vh;
      background: var(--blue);
      display: flex; flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-header h1 { color: white; font-size: 17px; font-weight: 700; }
    .sidebar-header p  { color: rgba(255,255,255,0.55); font-size: 12px; margin-top: 2px; }
    .sidebar-section { padding: 16px 24px 8px; }
    .sidebar-section span {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      color: rgba(255,255,255,0.4); text-transform: uppercase;
    }
    .biz-list { padding: 4px 12px; flex: 1; overflow-y: auto; }
    .biz-item {
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      color: rgba(255,255,255,0.75); font-size: 14px; font-weight: 500;
      margin-bottom: 2px; transition: all 0.15s;
      display: flex; align-items: center; gap: 10px;
    }
    .biz-item:hover  { background: rgba(255,255,255,0.1); color: white; }
    .biz-item.active { background: rgba(255,255,255,0.18); color: white; font-weight: 600; }
    .biz-item .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0;
    }
    .biz-item .all-dot { background: #fbbf24; }
    .sidebar-footer {
      padding: 16px 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .logout-btn {
      display: block; text-align: center; padding: 10px;
      background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7);
      border-radius: 8px; text-decoration: none; font-size: 13px;
      transition: background 0.15s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.18); color: white; }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      background: white; padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar h2 { font-size: 18px; color: var(--text); font-weight: 700; }
    .topbar .meta { font-size: 13px; color: var(--muted); }
    .live-badge {
      background: #dcfce7; color: #166534;
      font-size: 11px; font-weight: 700; padding: 4px 10px;
      border-radius: 20px; display: flex; align-items: center; gap: 5px;
    }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .content { flex: 1; padding: 24px 28px; overflow-y: auto; }

    /* ── Stats cards ── */
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card); border-radius: 14px;
      padding: 20px; border: 1px solid var(--border);
    }
    .stat-card .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 32px; font-weight: 800; color: var(--blue); margin: 6px 0 2px; }
    .stat-card .sublabel { font-size: 12px; color: var(--muted); }

    /* ── Filters ── */
    .filters {
      background: var(--card); border-radius: 14px; padding: 16px 20px;
      border: 1px solid var(--border); margin-bottom: 16px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .filters input, .filters select {
      padding: 8px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 13px; color: var(--text);
      outline: none; transition: border 0.2s; background: white;
    }
    .filters input:focus, .filters select:focus { border-color: var(--blue); }
    .filters input { flex: 1; min-width: 200px; }
    .btn-refresh {
      padding: 8px 16px; background: var(--blue); color: white;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.2s; margin-left: auto;
    }
    .btn-refresh:hover { background: var(--blue2); }

    /* ── Table ── */
    .table-wrap {
      background: var(--card); border-radius: 14px;
      border: 1px solid var(--border); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: #f8fafc; padding: 12px 16px;
      text-align: left; font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: #f8fafc; }
    tbody td {
      padding: 13px 16px; font-size: 13px;
      border-bottom: 1px solid var(--border); color: var(--text);
    }
    tbody tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
    }
    .badge-confirmed { background: #dcfce7; color: #166534; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; }
    .btn-cancel {
      padding: 5px 12px; background: #fff1f2; color: var(--red);
      border: 1.5px solid #fecaca; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-cancel:hover { background: var(--red); color: white; border-color: var(--red); }
    .btn-cancel:disabled { opacity: 0.35; cursor: not-allowed; }
    .empty {
      text-align: center; padding: 48px 0; color: var(--muted); font-size: 14px;
    }
    .empty .icon { font-size: 36px; margin-bottom: 8px; }
    .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    /* ── Responsive ── */
    @media(max-width:900px) {
      .stats { grid-template-columns: repeat(2,1fr); }
      .sidebar { width: 220px; }
    }
    @media(max-width:640px) {
      .sidebar { display: none; }
      .stats { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>🤖 AI Receptionist</h1>
    <p>Admin Dashboard</p>
  </div>
  <div class="sidebar-section"><span>Businesses</span></div>
  <nav class="biz-list" id="bizList">
    <div class="biz-item active" data-id="" onclick="selectBusiness('','All Businesses')">
      <span class="dot all-dot"></span> All Businesses
    </div>
  </nav>
  <div class="sidebar-footer">
    <a href="/admin/logout" class="logout-btn">🚪 Sign Out</a>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div>
      <h2 id="pageTitle">All Businesses</h2>
      <div class="meta" id="pageSubtitle">Showing all bookings</div>
    </div>
    <div class="live-badge"><span class="live-dot"></span> Live</div>
  </div>

  <div class="content">
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">Today</div>
        <div class="value" id="statToday">–</div>
        <div class="sublabel">bookings</div>
      </div>
      <div class="stat-card">
        <div class="label">This Week</div>
        <div class="value" id="statWeek">–</div>
        <div class="sublabel">bookings</div>
      </div>
      <div class="stat-card">
        <div class="label">This Month</div>
        <div class="value" id="statMonth">–</div>
        <div class="sublabel">bookings</div>
      </div>
      <div class="stat-card">
        <div class="label">All Time</div>
        <div class="value" id="statAll">–</div>
        <div class="sublabel">total bookings</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <input type="text" id="searchInput" placeholder="🔍  Search by name or phone…" oninput="loadBookings()">
      <select id="statusFilter" onchange="loadBookings()">
        <option value="">All Statuses</option>
        <option value="confirmed">Confirmed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button class="btn-refresh" onclick="refresh()">↻ Refresh</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Service</th>
            <th>Date</th>
            <th>Time</th>
            <th>Booked On</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="bookingsBody">
          <tr><td colspan="9" class="loading">Loading bookings…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let currentBizId = '';
  let currentBizName = 'All Businesses';

  // ── Load businesses into sidebar ─────────────────────────────────────
  async function loadBusinesses() {
    const res  = await fetch('/admin/api/businesses');
    const list = await res.json();
    const nav  = document.getElementById('bizList');

    // Keep "All" item
    list.forEach(b => {
      const el = document.createElement('div');
      el.className = 'biz-item';
      el.dataset.id = b.id;
      el.innerHTML = `<span class="dot"></span> ${b.name}`;
      el.onclick = () => selectBusiness(b.id, b.name);
      nav.appendChild(el);
    });
  }

  // ── Select a business ────────────────────────────────────────────────
  function selectBusiness(id, name) {
    currentBizId   = id;
    currentBizName = name;

    document.querySelectorAll('.biz-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });
    document.getElementById('pageTitle').textContent    = name;
    document.getElementById('pageSubtitle').textContent =
      id ? `Showing bookings for ${name}` : 'Showing all businesses';

    loadStats();
    loadBookings();
  }

  // ── Stats ────────────────────────────────────────────────────────────
  async function loadStats() {
    const url = '/admin/api/stats' + (currentBizId ? `?business_id=${currentBizId}` : '');
    const res  = await fetch(url);
    const s    = await res.json();
    document.getElementById('statToday').textContent = s.today;
    document.getElementById('statWeek').textContent  = s.week;
    document.getElementById('statMonth').textContent = s.month;
    document.getElementById('statAll').textContent   = s.all_time;
  }

  // ── Bookings table ───────────────────────────────────────────────────
  async function loadBookings() {
    const search = document.getElementById('searchInput').value;
    const status = document.getElementById('statusFilter').value;

    let url = '/admin/api/bookings?';
    if (currentBizId) url += `business_id=${currentBizId}&`;
    if (status)       url += `status=${status}&`;
    if (search)       url += `search=${encodeURIComponent(search)}&`;

    const res      = await fetch(url);
    const bookings = await res.json();
    const tbody    = document.getElementById('bookingsBody');

    if (!bookings.length) {
      tbody.innerHTML = `
        <tr><td colspan="9" class="empty">
          <div class="icon">📭</div>No bookings found.
        </td></tr>`;
      return;
    }

    tbody.innerHTML = bookings.map(b => {
      const [date, time] = splitDateTime(b.appointment_datetime);
      const badge = b.status === 'confirmed'
        ? '<span class="badge badge-confirmed">Confirmed</span>'
        : '<span class="badge badge-cancelled">Cancelled</span>';
      const cancelBtn = b.status === 'confirmed'
        ? `<button class="btn-cancel" onclick="cancelBooking(${b.id}, this)">Cancel</button>`
        : `<button class="btn-cancel" disabled>Cancelled</button>`;
      const createdAt = b.created_at ? b.created_at.substring(0,10) : '–';

      return `
        <tr id="row-${b.id}">
          <td><b>#${b.id}</b></td>
          <td>${esc(b.customer_name || '–')}</td>
          <td>${esc(b.customer_phone || '–')}</td>
          <td>${esc(b.service || '–')}</td>
          <td>${date}</td>
          <td>${time}</td>
          <td>${createdAt}</td>
          <td>${badge}</td>
          <td>${cancelBtn}</td>
        </tr>`;
    }).join('');
  }

  // ── Cancel booking ───────────────────────────────────────────────────
  async function cancelBooking(id, btn) {
    if (!confirm(`Cancel booking #${id}? This cannot be undone.`)) return;
    btn.disabled = true;
    btn.textContent = '…';

    await fetch(`/admin/api/bookings/${id}/cancel`, { method: 'POST' });
    await loadBookings();
    await loadStats();
  }

  // ── Helpers ──────────────────────────────────────────────────────────
  function splitDateTime(dt) {
    if (!dt) return ['–', '–'];
    const parts = dt.split(' ');
    return [parts[0] || '–', parts[1] || '–'];
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function refresh() {
    loadStats();
    loadBookings();
  }

  // ── Init ─────────────────────────────────────────────────────────────
  loadBusinesses();
  loadStats();
  loadBookings();

  // Auto-refresh every 30 seconds
  setInterval(refresh, 30000);
</script>
</body>
</html>
