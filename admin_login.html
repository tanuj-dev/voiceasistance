<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — AI Receptionist</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 380px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }
    .logo { font-size: 40px; text-align: center; margin-bottom: 8px; }
    h1 { text-align: center; color: #11418A; font-size: 20px; margin-bottom: 4px; }
    .sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 32px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type=password] {
      width: 100%; padding: 12px 16px;
      border: 2px solid #e5e7eb; border-radius: 10px;
      font-size: 15px; outline: none; transition: border 0.2s;
    }
    input[type=password]:focus { border-color: #11418A; }
    button {
      width: 100%; margin-top: 16px; padding: 14px;
      background: #11418A; color: white;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0d3270; }
    .error { color: #dc2626; font-size: 13px; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🔐</div>
  <h1>Admin Dashboard</h1>
  <p class="sub">AI Receptionist — Booking Management</p>
  <form method="POST" action="/admin/login">
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter admin password" autofocus required>
    <button type="submit">Sign In →</button>
    <!--ERROR-->
  </form>
</div>
</body>
</html>
